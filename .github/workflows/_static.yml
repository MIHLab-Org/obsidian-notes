name: Deploy Reveal.js Slides to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history, not just the latest commit

      - name: Generate index of presentations
        run: |
          cd export
          {
            echo "<!DOCTYPE html><html lang=\"en\"><head><meta charset=\"UTF-8\"><title>Presentations</title>"
            echo "<style>body{font-family:sans-serif;max-width:600px;margin:3rem auto}li{margin:.5rem 0}</style></head><body>"
            echo "<h1>Presentations</h1><ul>"
            for d in */; do
              name="${d%/}"
              # Most recent commit timestamp that touched this folder, as a sort key
              ts=$(git log -1 --format=%ct -- "export/$name" 2>/dev/null || echo 0)
              printf '%s\t%s\n' "$ts" "$name"
            done | sort -rn | cut -f2- | while IFS= read -r name; do
              encoded=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$name")
              echo "<li><a href=\"./${encoded}/\">${name}</a></li>"
            done
            echo "</ul></body></html>"
          } > index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "export/"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
