    <script type="text/javascript">
        function pageInIframe() {
            return (window.location !== window.parent.location);
        }

        let forgetPop = true;
        function onPopState(event) {
            if(forgetPop){
                forgetPop = false;
            } else if( pageInIframe()) {
                parent.postMessage(event.target.location.href, "app://obsidian.md");
            }
        }
        window.onpopstate = onPopState;
        window.onmessage = event => {
            if(event.data == "reload"){
                window.document.location.reload();
            }
            forgetPop = true;
        }

        function fitElements() {
            const itemsToFit = document.getElementsByClassName('fitText');
            for (const item in itemsToFit) {
                if (Object.hasOwnProperty.call(itemsToFit, item)) {
                    const element = itemsToFit[item];
                    fitElement(element, 1, 1000);
                    element.classList.remove('fitText');
                }
            }
        }

        function fitElement(element, start, end) {

            let size = (end + start) / 2;
            element.style.fontSize = `${size}px`;

            if (Math.abs(start - end) < 1) {
                while (element.scrollHeight > element.offsetHeight) {
                    size--;
                    element.style.fontSize = `${size}px`;
                }
                return;
            }

            if (element.scrollHeight > element.offsetHeight) {
                fitElement(element, start, size);
            } else {
                fitElement(element, size, end);
            }
        }

        document.onreadystatechange = () => {
            fitElements();
            if (document.readyState === 'complete') {
                if (pageInIframe() && window.location.href.indexOf("?export") != -1){
                    parent.postMessage(event.target.location.href, "app://obsidian.md");
                }
                if (window.location.href.indexOf("print-pdf") != -1){
                    let stateCheck = setInterval(() => {
                        clearInterval(stateCheck);
                        window.print();
                    }, 250);
                }
            }
        };
    </script>

#### Does Dante Love Beatrice?
    
> Consider, for example, one of the Western world’s most famous cases of romantic love, Dante’s love for Beatrice, immortalized in his *Divine Comedy* as well as in his earlier writings. Dante, who was scarecely older than Beaturice, saw her once when she was 9 years old; and once, when she was a teenager, he was greeted by her in passign her on the street. But these events and some occasional sightings of her from a distance seem to have been the extent of Dante’s connection to her. . . . In his account of his love of Beaturice, in his *La vita nuova,*  the way Dante himself describers his connection to Beatrice is just that he loves her, from a distance, with a love unrequited by her, for all he or anyone else knows.

Step 1

An opaque decision problem, $\\hat{\\Delta}$ = $\\langle \\text{S}^{\\hat{\\Delta}}, O^{\\hat{\\Delta}}, A^{\\hat{\\Delta}}, P^{\\hat{\\Delta}}, \\upsilon^{\\hat{\\Delta}}\\rangle$
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

A set of worlds, $\\Omega$.

In this case, there are various worlds. We shouldn’t yet assume that the acting agent has access to more than one of these just yet. Some worlds will be actual and others possible, hypothetical, and perhaps counter-factual (what could have happened _but did not_). However the counter-factual worlds here are of no consequence since such worlds would not factor into the agent’s decision making in a non-trivial way.
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

* A set of states, $S$.  
* A set of outcomes, $O$.  
* A set of acts, A $\\subseteq$ $S$ $\\rightarrow$ $O$.  
* A state-dependent probability function, P: $S$ $\\rightarrow$ $(P(S)$ $\\rightarrow$ [0,1]).  
* A value function, $\\upsilon$:  $O \\rightarrow \\mathbb{R}$
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

States, $s, s', s'', . . . \\in S$ are objects in a decision problem relevant to the agent’s decision but that they maybe unsure about. Outcomes, $o, o', o'', . . . \\in O$ are objects of an agent’s desires: E.g., “Being your own boss”. Acts, $a, b, c, . . . \\in A$ are the immediate objects of decision-making, “stacked your bread”.
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

Step 2

The set of state-dependent probability functions represent an agent’s credences at different states from the agent’s perspective from within the decision problem after potentially acquiring some information about the state they are in. Therefore, fore each $s \\in S, P\_{s}$ is the credence distribution adopted by the agent at $s$.
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

For any opaque decision problem $\\hat{\\Delta}$:

$\\Pi = S \\rightarrow A$ is the set of plans determined by $\\hat{\\Delta}$.
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

Plans, $\\pi, \\pi', \\pi'', . . . \\in \\Pi$ are functions from states $s,$ to acts, i.e., $\\pi(s) = a$ is the act $a$ recommended by plan $\\pi$ in state $s$.
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

MEV (Maximize Expected Value). Let $\\Pi\_{|MEV}$be the set of plans for MEV in $\\hat{\\Delta}$. Let $ev\_{s}(a)$ be the expected value of action $a$ at $s$ (for any $s \\in S$ and $s \\in A$).

$ev\_{s}(a) = \\sum\\limits\_{s’ \\in S} \\upsilon(a(s’)) \\cdot P\_{s}(s’)$
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

Then $\\pi \\in \\Pi\_{|MEV}$ iff for all $s \\in S$ and $a \\in A$:

$ev\_{s}(\\pi(s)) \\geq ev\_{s}(a)$
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

The expected value of an action at some state s, is the sum of values of the outcomes produced by that action at each state.

We weight the sum of values according to the probability that is assigned to that state from the perspective of that state.

A plan to maximize expected value then recommends, in each state, one of the acts which has optimal expected value at that state.
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

Step 3

The way an agent acts depends on the plan they are trying to follow. However, agents like us who are susceptible to error do not always act according to what their plan recommends for the state they are in. Rather we can understand their susceptibility to err in terms of their underlying pattern of dispositions. To represent these dispositions, we need to represent the state an agent is acting as if they are in, what we can call “enriched state spaces”.
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

For any opaque decision problem $\\hat{\\Delta}: [\\cdot]$ is a bijective function with domain $S$ which is a product of its domain and codomain, $\\bar{S}\_{[\\cdot]} = S \\times \\{[s] : s \\in S\\}$

Where any state $s, [s]$ represents an agent whose act is determined according to what their plan recommends for $s$ and an enriched state, $(s, [s’])$ represents the circumstances of an agent who is in s but whose act is determined according to what their plan recommends for $s’$. Sets of states in the enriched state space can be thought of as propositions which can tell us about:
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

1. what the world is like
2. what the agent will act as if the world is like
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

Step 4

Now we musts introduce a state-independent probability function over the enriched state space. This will represent the agent’s credences prior to finding themselves in the decision situation.
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

**Definition 5 (State-Independent Probability). For any** $\\hat{\\Delta}$ and $[\\cdot]$: a state-independent probability function, $P$, is a probability function over $P(\\bar{S}\_{[\\cdot]})$.

The state-independent probability function takes a stance on both what the world is like and how the agent will act as if the world is like. But it does not incorporate any information the agent acquires once they are at a particular state in the decision problem. For each state $s$, it reflects the agent’s prior credence regarding both how likely they are to find themselves at $s$, their prior dispositions for $s$, and how likely they are to act as if they are at $s$.
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

Therefore, for any $s,s’$,

$P([s’]|s) =$ $\\frac{P((s,[s']))}{P(\\{(s,[s'']):s''\\in S)\\})}$
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

That the probability that an agent’s estimate of their susceptibility to error at a state, s, relative to a plan, $\\pi$ is their credence assuming that they are in $s$, that they will act according to what their plan recommends for $s’$ instead.
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

According to $P$, an agent’s susceptibility to error at $s$, relative to $\\pi$ is proportional to:

$\\sum\\limits\_{\\substack{s' \\in S \\\\ \\pi(s)\\neq\\pi(s')}}P([s']|s)$
</div></script></section></div>

        function extend() {
            const target = {};
            for (let i = 0; i < arguments.length; i++) {
                const source = arguments[i];
                for (const key in source) {
                    if (source.hasOwnProperty(key)) {
                        target[key] = source[key];
                    }
                }
            }
            return target;
        }

        function isLight(color) {
            // normalize to rgb(a)
            const optionEl = document.createElement("option");
            optionEl.style.color = color;
            const normalizedColor = optionEl.style.color;

            const match = normalizedColor.match(/(\d+), (\d+), (\d+)/);
            if (!match) return false;
            const [, c_r, c_g, c_b] = match;

            const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
            return brightness > 155;
        }

        const bgColor = getComputedStyle(document.documentElement).getPropertyValue('--r-background-color').trim();
